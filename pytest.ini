[pytest]
# ═══════════════════════════════════════════════════════════
# 🛡️ AI Earth — Anti-Hang Test Configuration
# ═══════════════════════════════════════════════════════════
# Every test is HARD-KILLED after 90 seconds. No test can hang
# the suite. LLM integration tests get marked with @pytest.mark.llm
# so they can be run separately from the fast structural suite.
#
# Fast suite (no LLM calls):   pytest -m "not llm" -q
# LLM smoke suite (few calls): pytest -m llm -q
# ═══════════════════════════════════════════════════════════

timeout = 90
timeout_method = thread
session_timeout = 1200

markers =
    llm: makes real LLM API calls (slow, costs tokens, rate-limited)
    slow: slow test (>10s)

addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
